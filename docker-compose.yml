services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: dnd_user
      POSTGRES_PASSWORD: dnd_pass
      POSTGRES_DB: dnd_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://dnd_user:dnd_pass@db:5432/dnd_db}
    depends_on:
      - db

  frontend:
    image: 577817260098.dkr.ecr.eu-central-1.amazonaws.com/falkenwacht-frontend:latest
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
